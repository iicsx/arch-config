palette = "noctalia"
# Don't print a new line at the start of the prompt
add_newline = false
# Pipes ╰─ ╭─
# Powerline symbols                                     
# Wedges 🭧🭒 🭣🭧🭓
# Random noise 🬖🬥🬔🬗

# format = """
# $cmd_duration$username$hostname $directory $git_branch
# $character
# """
format = """
$username$hostname • $directory $time $git_branch
$character
"""

# Replace the "❯" symbol in the prompt with "➜"
[character]                            # The name of the module we are configuring is "character"
success_symbol = "[• ](bold fg:blue) "
error_symbol = "[• 󰅙](bold fg:red) "

# Disable the package module, hiding it from the prompt completely
[package]
disabled = true

[git_branch]
style = "bg:blue fg:red"
symbol = "󰘬"
truncation_length = 4
truncation_symbol = ""
format = "• [](bold bg:transparent fg:blue)[$symbol $branch(:$remote_branch)](fg:black bg:blue)[ ](bold bg:transparent fg:blue)"

[git_commit]
commit_hash_length = 4
tag_symbol = " "

[git_state]
format = '[\($state( $progress_current of $progress_total)\)]($style) '
cherry_pick = "[🍒 PICKING](bold red)"

[git_status]
conflicted = " 🏳 "
ahead = " 🏎💨 "
behind = " 😰 "
diverged = " 😵 "
untracked = " 🤷 ‍"
stashed = " 📦 "
modified = " 📝 "
staged = '[++\($count\)]($blue)'
renamed = " ✍️ "
deleted = " 🗑 "

[hostname]
ssh_only = false
format =  "[/$hostname](bg:blue bold fg:black)[](bold fg:blue )"
trim_at = ".companyname.com"
disabled = false

[line_break]
disabled = false

[memory_usage]
disabled = true
threshold = -1
symbol = " "
style = "bold dimmed green"

[time]
disabled = false
format = '• [](bold bg:transparent fg:blue)[   $time ](bg:blue bold fg:black)[](bold bg:transparent fg:blue)'
time_format = "%T"

[username]
style_user = "bold bg:blue fg:black"
style_root = "red bold"
format = "[](bold bg:transparent fg:blue)[$user]($style)"
disabled = false
show_always = true

[directory]
home_symbol = "  "
read_only = "  "
style = "bg:blue fg:black"
truncation_length = 6
truncation_symbol = "••/"
format = '[](bold bg:transparent fg:blue)[$path ]($style)[](bold bg:transparent fg:blue)'


[directory.substitutions]
"Desktop" = "  "
"Documents" = "  "
"Downloads" = "  "
"Music" = " 󰎈 "
"Pictures" = "  "
"Videos" = "  "

[cmd_duration]
min_time = 0
format = '[](bold bg:transparent fg:blue)[ $duration](bold bg:blue fg:black)[](bold bg:transparent fg:blue) •• '

