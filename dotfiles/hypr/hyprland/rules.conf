# ######## Window rules ########

# General rule – disable blur for all windows.
# (Using "class:.*" as a catch-all field since at least one field is required)
windowrule = no_blur on, match:class .*
windowrule = opacity 0.95, match:class ^(foot)$

# Uncomment to apply global transparency to all windows:
# windowrulev2 = opacity 0.89 override 0.89 override, class:.*

# Floating
windowrule = float on, match:class ^(blueberry\.py)$
windowrule = float on, size (monitor_w*0.4) (monitor_h*0.4), move cursor_x cursor_y, match:title ^(floating-foot)$
windowrule = float on, center on, size (monitor_w*0.66) (monitor_h*0.66), match:class ^(org.gnome.Settings)$
windowrule = float on, center on, size (monitor_w*0.66) (monitor_h*0.66), match:class ^(timeshift-gtk)$
windowrule = float on, center on, size (monitor_w*0.66) (monitor_h*0.66), match:class ^(org.gnome.NetworkDisplays)$
windowrule = float on, center on, size (monitor_w*0.66) (monitor_h*0.66), match:class ^(org.gnome.Nautilus)$
windowrule = float on, center on, size (monitor_w*0.5) (monitor_h*0.66), match:class ^(de.haeckerfelix.Fragments)$
windowrule = float on, center on, size (monitor_w*0.45) (monitor_h*0.45), match:title ^(Open Torrents)$
windowrule = float on, match:class ^(steam)$
windowrule = float on, match:class ^(guifetch)$   # FlafyDev/guifetch
windowrule = float on, size (monitor_w*0.45) (monitor_h*0.45), center on, match:class ^(pavucontrol)$
windowrule = float on, size (monitor_w*0.45) (monitor_h*0.45), center on, match:class ^(org.pulseaudio.pavucontrol)$
windowrule = float on, size (monitor_w*0.45) (monitor_h*0.45), center on, match:class ^(nm-connection-editor)$

# Tiling
windowrule = tile on, match:class ^dev\.warp\.Warp$

# Picture-in-Picture
windowrule = float on, keep_aspect_ratio on, move ((monitor_w*0.66)) ((monitor_h*0.66)), size (monitor_w*0.33) (monitor_h*0.33), pin on, match:title ^([Pp]icture[-\s]?[Ii]n[-\s]?[Pp]icture)(.*)$

# Dialog windows – float+center these windows.
windowrule = center on, float on, size (monitor_w*0.6) (monitor_h*0.6), match:title ^(Open File)(.*)$
windowrule = center on, float on, size (monitor_w*0.6) (monitor_h*0.6), match:title ^(Select a File)(.*)$
windowrule = center on, float on, size (monitor_w*0.6) (monitor_h*0.6), match:title ^(Choose wallpaper)(.*)$
windowrule = center on, float on, size (monitor_w*0.6) (monitor_h*0.6), match:title ^(Open Folder)(.*)$
windowrule = center on, float on, size (monitor_w*0.6) (monitor_h*0.6), match:title ^(Save As)(.*)$
windowrule = center on, float on, size (monitor_w*0.6) (monitor_h*0.6), match:title ^(Library)(.*)$
windowrule = center on, float on, size (monitor_w*0.6) (monitor_h*0.6), match:title ^(File Upload)(.*)$


# --- Tearing ---
windowrule = immediate on, match:title .*\.exe
windowrule = immediate on, match:class ^(steam_app)

# No shadow for tiled windows (matches windows that are not floating).
windowrule = no_shadow on, match:float 0

# ######## Layer rules ########
layerrule = xray 1, match:class .*
# layerrule = noanim, .*
layerrule = no_anim on, match:class walker
layerrule = no_anim on, match:class selection
layerrule = no_anim on, match:class overview
layerrule = no_anim on, match:class anyrun
layerrule = no_anim on, match:class indicator.*
layerrule = no_anim on, match:class osk
layerrule = no_anim on, match:class hyprpicker
layerrule = blur on, ignore_alpha 0.6, match:namespace shell:*

layerrule = no_anim on, match:namespace noanim
layerrule = blur on, ignore_alpha 0, match:namespace gtk-layer-shell
layerrule = blur on, ignore_alpha 0.5, match:namespace launcher
layerrule = blur on, ignore_alpha 0.69, match:namespace notifications
layerrule = blur on, match:namespace logout_dialog # wlogout

# ags
layerrule = animation slide left, match:namespace sideleft.*
layerrule = animation slide right, match:namespace sideright.*
layerrule = blur on, match:namespace session[0-9]*
layerrule = blur on, ignore_alpha 0.6, match:namespace bar[0-9]*
layerrule = blur on, ignore_alpha 0.6, match:namespace barcorner.*
layerrule = blur on, ignore_alpha 0.6, match:namespace dock[0-9]*
layerrule = blur on, ignore_alpha 0.6, match:namespace indicator.*
layerrule = blur on, ignore_alpha 0.6, match:namespace overview[0-9]*
layerrule = blur on, ignore_alpha 0.6, match:namespace cheatsheet[0-9]*
layerrule = blur on, ignore_alpha 0.6, match:namespace sideright[0-9]*
layerrule = blur on, ignore_alpha 0.6, match:namespace sideleft[0-9]*
layerrule = blur on, ignore_alpha 0.6, match:namespace osk[0-9]*

# Fullscreen
windowrule = maximize on, match:class ^(org.qutebrowser.qutebrowser)$

